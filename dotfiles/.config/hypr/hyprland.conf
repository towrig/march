# Hyprland Configuration
# See https://wiki.hyprland.org/Configuring/
# Note: hyprbars plugin is installed via hyprpm and loaded automatically

# Monitor configuration
monitor=,preferred,auto,1

# Execute on startup
exec-once = waybar
exec-once = swaync
exec-once = awww-daemon && awww img ~/.config/wallpapers/crater.png --transition-type fade

# Environment variables
env = XCURSOR_SIZE,24
#env = QT_QPA_PLATFORMTHEME,qt5ct <- not sure if this will be needed

# Input configuration
input {
    kb_layout = et
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# General appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = 0xF0105090
    col.inactive_border = 0x66105090
    layout = dwindle
}

# Decoration
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0x1a1a1a
    }
}

# Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}


# floating wm
windowrulev2 = float, class:.*
windowrulev2 = maxsize 1920 950, class:.*
windowrulev2 = size 720 457, class:^(alacritty)$
# windowrulev2 = center, class:.*

# eyecandy
layerrule = blur, ^(notifications)$
layerrule = blur, ^(rofi)$
layerrule = blur, ^(waybar)$

windowrulev2 = opacity 0.7 0.7, class:^(alacritty)$

master {
    new_status = master
}

# Key bindings
$mainMod = SUPER

bind = $mainMod, Return, exec, alacritty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, rofi -show drun -show-icons
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen,

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot - TODO: write own screenshot package
#bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Hyprbars plugin configuration
plugin {
    hyprbars {
        # Bar settings
        bar_height = 28
        bar_padding = 10
        bar_button_padding = 8
        bar_precedence_over_border = true
        bar_part_of_window = true

        # Colors matching border theme (teal: 0x105090)
        bar_color = 0xF0081830
        col.text = 0xFFFFFFFF
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_size = 11
        bar_text_align = center

        # Window buttons (left to right: close, maximize, minimize)
        # hyprbars-button = color, size, icon, on-click
        hyprbars-button = 0xFFFF6B6B, 14, 󰖭, hyprctl dispatch killactive
        hyprbars-button = 0xFF50FA7B, 14, 󰊓, hyprctl dispatch fullscreen 1
        hyprbars-button = 0xFFF9E2AF, 14, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

# Enable screen sharing
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP